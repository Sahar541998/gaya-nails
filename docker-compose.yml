services:
  postgres:
    image: postgres:16-alpine
    container_name: gaya-nails-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gaya
      POSTGRES_PASSWORD: gaya
      POSTGRES_DB: gaya_nails
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaya -d gaya_nails"]
      interval: 5s
      timeout: 5s
      retries: 10

  sms:
    build:
      context: ./docker/sms-mock
    container_name: gaya-nails-sms
    restart: unless-stopped
    ports:
      - "4010:4010"
    environment:
      PORT: "4010"
      MOCK_CODE: "000000"

  app:
    build:
      context: .
    container_name: gaya-nails-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://gaya:gaya@postgres:5432/gaya_nails
      SMS_DRIVER: docker
      SMS_MOCK_URL: http://sms:4010
      ADMIN_USERNAME: gaya
      ADMIN_PASSWORD: gaya-local
      ADMIN_JWT_SECRET: local-dev-only-change-me
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      sms:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
  app_next:
